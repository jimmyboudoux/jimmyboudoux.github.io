<!doctype html>
<html lang="{{ site.lang | default: 'fr' }}">
  <head>
    {% include head/meta.html %} {% include head/structured-data.html %} {% include head/analytics.html %}
  </head>
  <body class="{{ page.theme | default: 'theme-ai' }}">
    <a class="skip-link" href="#main-content">Aller au contenu</a>
    {% include header.html %}
    <main id="main-content">{{ content }}</main>
    {% include footer.html %}
    <script type="module" src="{{ '/assets/js/site.mjs' | relative_url }}?v={{ site.asset_version }}"></script>
    {% for script in page.extra_js %}
    <script src="{{ script | relative_url }}?v={{ site.asset_version }}" defer></script>
    {% endfor %} {% for script in page.extra_modules %}
    <script type="module" src="{{ script | relative_url }}?v={{ site.asset_version }}"></script>
    {% endfor %}
  </body>
</html>
