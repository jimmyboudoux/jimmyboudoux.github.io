<!doctype html>
<html lang="{{ site.lang | default: 'fr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="author" content="Jimmy Boudoux">
  {% if page.noindex %}<meta name="robots" content="noindex">{% endif %}
  <meta name="theme-color" content="#fbfaf7">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}/assets/img/og.png">
  <meta property="og:image:width" content="1730">
  <meta property="og:image:height" content="909">
  <meta property="og:image:alt" content="Jimmy Boudoux — Ingénieur IA, Data & Software">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
  <meta name="twitter:image" content="{{ site.url }}/assets/img/og.png">
  <meta name="twitter:image:alt" content="Jimmy Boudoux — Ingénieur IA, Data & Software">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="shortcut icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/site.css?v={{ site.time | date: '%s' }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Person",
        "@id": "{{ site.url }}/#jimmy-boudoux",
        "name": "Jimmy Boudoux",
        "url": "{{ site.url }}/",
        "image": "{{ site.url }}/assets/img/avatar.png",
        "jobTitle": "Ingénieur IA, Data & Software",
        "sameAs": ["{{ site.linkedin }}", "{{ site.github }}"]
      },
      {
        "@type": "ProfessionalService",
        "@id": "{{ site.url }}/#professional-service",
        "name": "Jimmy Boudoux",
        "alternateName": "Boudoux Jimmy EI",
        "url": "{{ site.url }}/",
        "image": "{{ site.url }}/assets/img/og.png",
        "description": "{{ site.description }}",
        "email": "contact@jboudoux.fr",
        "founder": { "@id": "{{ site.url }}/#jimmy-boudoux" },
        "areaServed": [
          { "@type": "City", "name": "Poitiers" },
          { "@type": "City", "name": "Châtellerault" },
          { "@type": "City", "name": "Niort" },
          { "@type": "City", "name": "La Rochelle" },
          { "@type": "City", "name": "Tours" },
          { "@type": "City", "name": "Angoulême" },
          { "@type": "City", "name": "Bordeaux" },
          { "@type": "Country", "name": "France" }
        ],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Poitiers",
          "postalCode": "86000",
          "addressCountry": "FR"
        },
        "sameAs": ["{{ site.linkedin }}", "{{ site.github }}"]
      },
      {
        "@type": "WebSite",
        "@id": "{{ site.url }}/#website",
        "name": "{{ site.title }}",
        "url": "{{ site.url }}/",
        "inLanguage": "fr-FR",
        "publisher": { "@id": "{{ site.url }}/#professional-service" }
      }
    ]
  }
  </script>
<script
  defer
  src="https://collect.jboudoux.fr/script.js"
  data-website-id="01018f06-797d-46f8-ae7f-9b172b2e1893">
</script>
</head>
<body class="{{ page.theme | default: 'theme-ai' }}">
  <a class="skip-link" href="#main-content">Aller au contenu</a>
  {% include header.html %}
  <main id="main-content">{{ content }}</main>
  {% include footer.html %}
  <script src="/assets/js/site.js?v={{ site.time | date: '%s' }}" defer></script>
  {% for script in page.extra_js %}
  <script src="{{ script }}?v={{ site.time | date: '%s' }}" defer></script>
  {% endfor %}
</body>
</html>
