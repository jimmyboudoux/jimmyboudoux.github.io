<header class="site-header">
  <div class="navbar">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Accueil — {{ site.person_name | escape }}"
      >jboudoux.fr</a
    >
    {% assign tariff_current = false %}{% assign contact_current = false %} {% if page.url == '/tarifs/' %}{% assign
    tariff_current = 'page' %}{% endif %} {% if page.url == '/contact/' %}{% assign contact_current = 'page' %}{% endif
    %}
    <nav class="header-links" aria-label="Accès rapides">
      <a href="{{ '/tarifs/' | relative_url }}" aria-current="{{ tariff_current }}">Tarifs</a>
      <a href="{{ '/#approche' | relative_url }}">Méthode</a>
      <a href="{{ '/contact/' | relative_url }}" aria-current="{{ contact_current }}">Contact</a>
    </nav>
    <button
      class="menu-btn"
      type="button"
      aria-label="Ouvrir le menu"
      aria-controls="main-navigation"
      aria-expanded="false"
      data-menu-button
      hidden
    >
      Menu
    </button>
  </div>
</header>
