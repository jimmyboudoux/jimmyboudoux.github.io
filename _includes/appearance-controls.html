<div class="appearance-controls" data-appearance-controls hidden>
  <label
    ><span>Présentation</span>
    <select aria-label="Présentation du site" data-presentation-select>
      <option value="commercial">Commercial</option>
      <option value="minimalist">Minimaliste</option>
    </select>
  </label>
  <label data-theme-switcher hidden
    ><span>Thème</span>
    <select aria-label="Thème de couleur" data-theme-select>
      <option value="system">Système</option>
      <option value="light">Clair</option>
      <option value="dark">Sombre</option>
    </select>
  </label>
  <span class="appearance-status" role="status" data-appearance-status></span>
</div>
