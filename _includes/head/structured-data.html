{% assign homepage = '/' | absolute_url %} {% assign person_id = '/#jimmy-boudoux' | absolute_url %} {% assign
service_id = '/#professional-service' | absolute_url %} {% assign website_id = '/#website' | absolute_url %}
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Person",
        "@id": {{ person_id | jsonify }},
        "name": {{ site.person_name | jsonify }},
        "url": {{ homepage | jsonify }},
        "image": {{ '/assets/img/avatar-512.png' | absolute_url | jsonify }},
        "jobTitle": {{ site.professional_title | jsonify }},
        "sameAs": [{{ site.linkedin | jsonify }}, {{ site.github | jsonify }}]
      },
      {
        "@type": "ProfessionalService",
        "@id": {{ service_id | jsonify }},
        "name": {{ site.person_name | jsonify }},
        "alternateName": {{ site.legal_name | jsonify }},
        "url": {{ homepage | jsonify }},
        "image": {{ '/assets/img/og-optimized.png' | absolute_url | jsonify }},
        "description": {{ site.description | jsonify }},
        "email": {{ site.email | jsonify }},
        "founder": { "@id": {{ person_id | jsonify }} },
        "areaServed": [
          {% for city in site.data.profile.area_served %}
          { "@type": "City", "name": {{ city | jsonify }} }{% unless forloop.last %},{% endunless %}
          {% endfor %},
          { "@type": "Country", "name": "France" }
        ],
        "address": {
          "@type": "PostalAddress",
          "streetAddress": {{ site.data.profile.address.street | jsonify }},
          "addressLocality": {{ site.data.profile.address.city | jsonify }},
          "postalCode": {{ site.data.profile.address.postal_code | jsonify }},
          "addressCountry": "FR"
        },
        "sameAs": [{{ site.linkedin | jsonify }}, {{ site.github | jsonify }}]
      },
      {
        "@type": "WebSite",
        "@id": {{ website_id | jsonify }},
        "name": {{ site.title | jsonify }},
        "url": {{ homepage | jsonify }},
        "inLanguage": "fr-FR",
        "publisher": { "@id": {{ service_id | jsonify }} }
      }
    ]
  }
</script>
