<div class="engineering-map" aria-label="Approche en quatre étapes : comprendre, concevoir, construire et mesurer">
  <div class="map-atmosphere" aria-hidden="true"></div>
  <div class="map-connectors" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <article class="map-card map-card--understand">
    {% include icon.html name="search" class="map-icon" %}
    <b>Comprendre</b><span>le contexte</span>
  </article>
  <article class="map-card map-card--design">
    {% include icon.html name="cube" class="map-icon" %}
    <b>Concevoir</b><span>l’architecture</span>
  </article>
  <article class="map-card map-card--build">
    {% include icon.html name="code" class="map-icon" %}
    <b>Construire</b><span>le système</span>
  </article>
  <article class="map-card map-card--measure">
    {% include icon.html name="chart" class="map-icon" %}
    <b>Mesurer</b><span>l’impact</span>
  </article>
</div>
