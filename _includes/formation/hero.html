{% assign formation = include.formation %}
<section class="formation-hero {{ formation.theme }}">
  <div class="container narrow">
    <nav class="breadcrumb" aria-label="Fil d’Ariane">
      <a href="{{ '/' | relative_url }}">Accueil</a><span aria-hidden="true">/</span>
      <a href="{{ '/formations/' | relative_url }}">Formations IA</a><span aria-hidden="true">/</span>
      <span aria-current="page">{{ formation.short_title }}</span>
    </nav>
    <a class="back-link" href="{{ '/formations/' | relative_url }}">← Toutes les formations</a>
    <span class="eyebrow">Formation intra-entreprise</span>
    <h1>{{ formation.title }}</h1>
    <p class="lead">{{ formation.promise }}</p>
    <div class="actions">
      <a class="btn" href="{{ '/contact/' | relative_url }}">Demander un devis →</a>
      <a class="btn btn--ghost" href="mailto:{{ site.email }}?subject={{ formation.short_title | url_encode }}"
        >Parler de votre équipe</a
      >
    </div>
  </div>
</section>
