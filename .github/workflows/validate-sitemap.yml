name: Validate Jekyll sitemap

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - run: bundle exec jekyll build
      - run: ruby script/validate_sitemap.rb
      - run: ruby script/validate_diagnostic.rb
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
        working-directory: worker
