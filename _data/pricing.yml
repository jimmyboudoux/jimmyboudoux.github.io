# Montants en euros HT. Modifier chaque montant uniquement ici.
expert_review:
  label: Revue experte ciblée
  short: Une question principale, quelques éléments à examiner, une analyse et une recommandation synthétique.
  amount: 390
framing:
  label: Cadrage ciblé
  short: Clarifier un problème principal, comprendre l’existant, comparer les options et recommander la prochaine étape.
  amount: 900
automation:
  label: Automatisation
  short: 'Automatiser un flux avec la solution adaptée : déterministe, LLM/agent ou hybride.'
  amount: 1500
  prefix: 'À partir de '
local_ai:
  prototype:
    label: Prototype IA locale ciblé
    short: Valider techniquement un scénario local ciblé. Pour comparer plusieurs configurations dans un environnement temporaire,
      voir la Sandbox IA locale.
    amount: 1500
    prefix: 'À partir de '
ai_portal:
  essential:
    label: Portail IA essentiel
    short: Une interface IA simple connectée aux modèles choisis par l’entreprise.
    amount: 1500
    prefix: 'À partir de '
  enterprise:
    label: Portail IA d’entreprise
    short: Un portail IA intégré à l’environnement, aux utilisateurs et aux contraintes de l’entreprise.
    amount: 4000
    prefix: 'À partir de '
software_rescue:
  label: Reprise & stabilisation logicielle
  short: Reprendre une application fragile, legacy ou vibe codée et construire une trajectoire de stabilisation.
  amount: 2500
  prefix: 'À partir de '
audit:
  ranges:
    targeted:
      label: Audit ciblé
      amount: 2500
      max_amount: 4000
    multi_subject:
      label: Audit multi-sujets
      amount: 4500
      max_amount: 8000
    transverse:
      label: Audit transverse
      amount: 8000
      max_amount: 20000
      suffix: ' et plus'
fractional:
  light:
    label: Pilotage léger
    meetings_min: 1
    meetings_max: 2
    amount: 900
    max_amount: 1500
    period: mois
  regular:
    label: Pilotage régulier
    amount: 2000
    max_amount: 3500
    period: mois
  transverse:
    label: Direction transverse
    amount: 3500
    max_amount: 6500
    period: mois
  reinforced:
    label: Direction renforcée
    amount: 6500
    prefix: 'À partir de '
    period: mois
sandbox:
  label: Sandbox IA locale
  amount: 2400
  prefix: 'À partir de '
  duration_days: 30
  max_configurations: 2
  configurations:
    - id: base
      label: Jusqu’à 2 configurations
      supplement: 0
    - id: four
      label: Jusqu’à 4 configurations
      supplement: 800
    - id: six
      label: Jusqu’à 6 configurations
      supplement: 1500
  hardware_pack_discount_percent: 10
  hardware:
    - id: lite
      label: Profil Lite
      supplement: 100
    - id: standard
      label: Profil Standard
      supplement: 180
    - id: premium
      label: Profil Premium
      supplement: 500
  interfaces:
    - id: api
      label: Votre propre interface ou instance via API
      supplement: 0
      description: Un accès API sécurisé aux modèles sélectionnés est inclus pendant la durée de l’expérimentation. Connectez vos outils ou votre propre instance, dans les limites d’utilisation convenues.
    - id: hosted
      label: Interface de chat hébergée
      supplement: 200
      monthly: true
      description: Je prépare et administre une interface de chat temporaire utilisable dans votre navigateur. L’accès API reste inclus. La création d’un connecteur ou d’un agent spécifique fait l’objet d’un devis séparé.
  extras:
    - id: training
      label: Formation et accompagnement approfondis
      supplement: 900
      description: Deux sessions de 1h30 sur les modèles, moteurs d’inférence, quantifications, performances, API, contraintes mémoire ou futur déploiement interne.
    - id: report
      label: Rapport comparatif approfondi
      supplement: 700
      description: Analyse détaillée avec recommandations d’architecture et de dimensionnement. La synthèse concise reste incluse dans le forfait.
  extension:
    label: Prolongation sans nouvelle campagne de tests
    description: Sur devis selon les accès et prestations maintenus.
