ai-literacy:
  short_title: "AI Literacy"
  title: "AI Literacy — comprendre et utiliser l’IA en entreprise"
  card_title: "AI Literacy"
  badge: "Offre de lancement"
  theme: "theme-ai"
  promise: "Donner à tous les collaborateurs les bons repères pour utiliser l’IA avec discernement."
  summary: "Des fondamentaux concrets pour choisir les bons usages, formuler de meilleures demandes et garder une vérification humaine."
  audience: "Collaborateurs, managers, équipes support et métiers, dirigeants de PME et équipes projet."
  prerequisites: "Aucun prérequis technique. Savoir utiliser un navigateur et les outils bureautiques usuels est recommandé pour les exercices."
  level: "Débutant à intermédiaire"
  capacity: "4 à 12 participants"
  duration: "½ journée ou 1 journée"
  format_short: "3 h 30 ou 7 h · présentiel ou distanciel synchrone"
  starting_price: "650 € HT"
  formats:
    - label: "Essentiel"
      duration: "3 h 30"
      purpose: "Sensibiliser, pratiquer les fondamentaux et sécuriser les premiers usages."
    - label: "Approfondi"
      duration: "7 h"
      purpose: "Consolider les fondamentaux et travailler des cas d’usage métier."
  objectives:
    - "Expliquer le principe général d’un modèle de langage et ses limites."
    - "Identifier des usages pertinents, les risques et les règles de précaution associées."
    - "Rédiger et améliorer un prompt structuré pour une tâche métier simple."
    - "Vérifier de façon critique une réponse avant de la réutiliser."
    - "Définir une règle d’usage ou une action concrète applicable à son activité."
  programme:
    - title: "Format essentiel · 3 h 30"
      items:
        - "Comprendre l’IA générative : vocabulaire utile, forces et limites."
        - "Identifier les usages et les risques : erreurs, confidentialité, biais, propriété intellectuelle et sécurité."
        - "Bien formuler une demande : rôle, contexte, tâche, contraintes, format et itération."
        - "Vérifier et décider : relecture, sources, chiffres et décisions à impact."
        - "Ancrer les bonnes pratiques, évaluation finale et bilan."
    - title: "Complément approfondi · 3 h 30"
      items:
        - "Retour sur les acquis et questions issues du terrain."
        - "Cartographier les tâches augmentables et sélectionner des cas d’usage."
        - "Ateliers de prompting métier adaptés aux rôles des participants."
        - "Cas de gouvernance légère et plan d’action d’équipe."
        - "Évaluation sommative et bilan."
  methods: "Formation synchrone intra-entreprise : apports courts, démonstrations, quiz, exercices individuels, échanges et cas d’usage collectifs."
  resources: "Support de présentation, fiche mémo, consignes d’exercices et ressources de veille. Un ordinateur personnel est recommandé pour les exercices."
  assessment: "Positionnement préalable, exercices et mises en situation pendant la session, puis quiz final et cas pratique. Une évaluation à chaud clôture la session."
  access_delay: "Sous réserve de la finalisation du besoin, de l’accord sur le devis et des disponibilités, une session peut en principe être planifiée sous 15 jours ouvrés. Ce délai est confirmé dans la proposition."
  prices:
    - format: "Demi-journée"
      price: "650 € HT"
    - format: "Journée"
      price: "1 200 € HT"

finops-ia:
  short_title: "FinOps IA"
  title: "FinOps IA — piloter les coûts, la valeur et les risques de l’IA"
  card_title: "FinOps IA"
  theme: "theme-finops"
  promise: "Rendre visibles les coûts, les arbitrages et la valeur des usages IA."
  summary: "Une méthode commune pour relier coût, qualité, risque et valeur avant de multiplier les usages."
  audience: "Dirigeants, DSI, responsables IT, cloud, data ou innovation, product owners, finance et contrôle de gestion."
  prerequisites: "Connaître les grandes lignes de l’organisation et avoir une première exposition aux usages IA, cloud ou SaaS est recommandé."
  level: "Intermédiaire"
  capacity: "4 à 10 participants"
  duration: "½ journée ou 1 journée"
  format_short: "3 h 30 ou 7 h · présentiel ou distanciel synchrone"
  starting_price: "900 € HT"
  formats:
    - label: "Cadrage"
      duration: "3 h 30"
      purpose: "Créer une culture commune et sortir avec une grille de coûts et de risques."
    - label: "Atelier approfondi"
      duration: "7 h"
      purpose: "Chiffrer des cas d’usage, définir des indicateurs et un plan d’action."
  objectives:
    - "Décomposer les principaux postes de coût d’un usage IA."
    - "Expliquer les compromis entre coût, qualité, latence, confidentialité et risque."
    - "Construire une première grille de lecture d’un cas d’usage IA."
    - "Choisir des indicateurs de suivi adaptés à un cas d’usage."
    - "Proposer un rituel ou une règle de gouvernance FinOps IA."
  programme:
    - title: "Format cadrage · 3 h 30"
      items:
        - "Pourquoi FinOps IA : consommation variable, coûts cachés, expérimentation et qualité."
        - "Lire le coût complet : API, infrastructure, stockage, données, licences, intégration et exploitation."
        - "Arbitrer coût, qualité et risque sur des options techniques concrètes."
        - "Mesurer ce qui compte : volume, coût, qualité, adoption, incidents et bénéfice."
        - "Atelier de priorisation, évaluation finale et bilan."
    - title: "Complément approfondi · 3 h 30"
      items:
        - "Établir des hypothèses robustes et comparer des scénarios."
        - "Calculer et comparer le coût par usage et le coût total de possession."
        - "Piloter et optimiser : budgets, limites, cache, observabilité et gouvernance."
        - "Mettre en place un rituel de revue et une recommandation de synthèse."
  methods: "Formation synchrone intra-entreprise : apports structurés, cas chiffrés, échanges inter-fonctionnels, travaux en sous-groupes et restitution."
  resources: "Support de formation, canevas de cartographie de coûts, fiche d’indicateurs, modèle de rituel de revue et ressources de veille."
  assessment: "Questionnaire de positionnement, exercices chiffrés et canevas pendant la session, puis quiz et recommandation sur un cas. Une évaluation à chaud clôture la session."
  access_delay: "Sous réserve de l’analyse du besoin, de l’accord et des disponibilités, une session peut en principe être planifiée sous 15 jours ouvrés. Confirmation au devis."
  prices:
    - format: "Demi-journée"
      price: "900 € HT"
    - format: "Journée"
      price: "1 450 € HT"

ia-locale:
  short_title: "Découverte de l’IA locale"
  title: "Découverte de l’IA locale — exploiter l’IA sans exposer ses données"
  card_title: "Découverte de l’IA locale"
  theme: "theme-engineering"
  promise: "Comprendre quand et comment exécuter une IA au plus près de ses données."
  summary: "Les repères nécessaires pour comparer les options d’IA locale, auto-hébergée et managée avant un éventuel déploiement."
  audience: "DSI, RSSI, responsables data ou IA, équipes IT, architectes, développeurs, responsables innovation et décideurs."
  prerequisites: "Comprendre les usages de base de l’IA générative. Une familiarité avec les données, le poste de travail, le serveur, le cloud ou les API est recommandée."
  level: "Intermédiaire"
  capacity: "4 à 10 participants"
  duration: "½ journée ou 1 journée"
  format_short: "3 h 30 ou 7 h · présentiel ou distanciel synchrone"
  starting_price: "1 000 € HT"
  formats:
    - label: "Découverte"
      duration: "3 h 30"
      purpose: "Comprendre les choix et décider si un pilote mérite d’être étudié."
    - label: "Découverte + atelier de décision"
      duration: "7 h"
      purpose: "Analyser des cas d’usage et bâtir une première feuille de route de pilote."
  objectives:
    - "Distinguer SaaS, API managée, cloud privé, auto-hébergement et exécution locale."
    - "Identifier ce que l’IA locale améliore réellement pour les données, et ses limites."
    - "Qualifier un cas d’usage selon confidentialité, qualité, latence, coût et exploitation."
    - "Comparer de manière argumentée des options de déploiement."
    - "Formuler les prochaines étapes réalistes d’un pilote, d’une évaluation ou d’un non-choix."
  programme:
    - title: "Format découverte · 3 h 30"
      items:
        - "Pourquoi parler d’IA locale : opportunités, idées reçues et limites."
        - "Modèles et modes de déploiement : SaaS, API, cloud, serveur interne et poste local."
        - "Données, sécurité et responsabilités : flux, accès, journaux et confidentialité."
        - "Choisir une option adaptée avec une grille de décision et une démonstration guidée."
        - "Évaluation finale et bilan."
    - title: "Complément atelier de décision · 3 h 30"
      items:
        - "Qualifier les cas d’usage et concevoir une architecture de principe."
        - "Évaluer le coût et l’exploitation sans simplification abusive."
        - "Préparer un pilote responsable : critères, limites, réversibilité et décision go/no-go."
        - "Cas pratique et évaluation."
  methods: "Formation synchrone intra-entreprise : visualisations d’architecture, démonstration encadrée, étude de cas, atelier de décision et échanges métier-technique."
  resources: "Support de formation, glossaire, matrice d’aide à la décision, fiche de précautions de sécurité et confidentialité, canevas de pilote responsable et ressources de veille."
  assessment: "Auto-évaluation et quiz initial, analyse de scénarios et choix d’architecture pendant la session, puis quiz et cas de décision. Une évaluation à chaud clôture la session."
  access_delay: "Sous réserve de l’analyse du besoin, de l’accord et des disponibilités, une session peut en principe être planifiée sous 15 jours ouvrés. Une démonstration spécifique ou une adaptation peut demander un délai complémentaire."
  prices:
    - format: "Demi-journée"
      price: "1 000 € HT"
    - format: "Journée"
      price: "1 500 € HT"
